site_name: Siber Alemden Havadisler (S.A.H)
site_url: https://ytalharabaci.github.io/sah-ongoru-analizi/
repo_url: https://github.com/ytalharabaci/sah-ongoru-analizi
repo_name: ytalharabaci/sah-ongoru-analizi
site_description: Utku Şen'in S.A.H yayınlarındaki gelecek tahminlerinin açık kaynaklı yapay zeka doğrulama arşivi
site_author: Yusuf Talha ARABACI

theme:
  name: material
  language: tr
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    scheme: default
    primary: white
    accent: indigo

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - attr_list

nav:
  - "Genel Bakış": index.md
  - "Tutan Öngörüler (Vitrin)": vitrin.md
  - "Tüm Karar Arşivi": arsiv.md
  - "Metodoloji ve Uyarı": metodoloji.md

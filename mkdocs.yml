site_name: Siber Alemden Havadisler (S.A.H)
site_url: https://ytalharabaci.github.io/sah-ongoru-analizi/
repo_url: https://github.com/ytalharabaci/sah-ongoru-analizi
repo_name: ytalharabaci/sah-ongoru-analizi
site_description: Utku Şen'in S.A.H yayınlarındaki gelecek tahminlerinin açık kaynaklı yapay zeka doğrulama arşivi
site_author: Yusuf Talha ARABACI

theme:
  name: material
  language: tr
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
  palette:
    # Aydınlık Mod (Clean Modern Slate)
    - scheme: default
      primary: slate
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Karanlık moda geç
    # Karanlık Mod (Dark Mode)
    - scheme: slate
      primary: slate
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Aydınlık moda geç
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - en
        - tr

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - attr_list

nav:
  - "Genel Bakış": index.md
  - "Tutan Tahminler": tutanlar.md
  - "Tüm Karar Arşivi": arsiv.md
  - "Metodoloji ve Uyarı": metodoloji.md

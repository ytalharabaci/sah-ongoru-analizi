site_name: Siber Alemden Havadisler (S.A.H)
site_url: https://ytalharabaci.github.io/sah-ongoru-analizi/
repo_url: https://github.com/ytalharabaci/sah-ongoru-analizi
repo_name: ytalharabaci/sah-ongoru-analizi
site_description: Utku Şen'in S.A.H yayınlarındaki gelecek tahminlerinin açık kaynaklı yapay zeka doğrulama arşivi
site_author: Yusuf Talha ARABACI

theme:
  name: material
  language: tr
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
  palette:
    scheme: default
    primary: white
    accent: indigo
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - en
        - tr

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/filter.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - attr_list
  - toc:
      permalink: true
      toc_depth: 2

nav:
  - "Genel Bakış": index.md
  - "Tahminler": arsiv.md
  - "Metodoloji": metodoloji.md
